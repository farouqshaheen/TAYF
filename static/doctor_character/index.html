<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1520" />
    <title>مشرف المختبر ثلاثي الأبعاد</title>
    <script type="module" crossorigin src="./assets/doctor-viewer.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/doctor-style.css">
  </head>
  <body>
    <main id="assistant" aria-label="المساعد الأكاديمي د. محمد">
      <section id="stage" aria-label="مجسم الدكتور محمد ثلاثي الأبعاد">
        <div id="loading" role="status">جارٍ تحميل المجسم…</div>
        <div id="status">اسحب للتدوير · مرّر للتكبير</div>
        <div id="error" hidden>تعذر تحميل المجسم. تأكد أن ملفات static متاحة.</div>
      </section>
      <section id="speech-bubble" aria-live="polite">
        <div class="speech-head">
          <span class="speaker-name">د. محمد <span class="speaker-role">· مشرف المختبر</span></span>
          <span id="speaking-indicator" aria-hidden="true"><i></i><i></i><i></i></span>
          <button id="speak-button" type="button" aria-label="استمع إلى رسالة الدكتور">استمع</button>
        </div>
        <p id="speech-text">أهلاً بك في مختبر طيف.. افحص تدهور القناة واكتشف مين اللي شوش على اجتماعي اليوم!</p>
      </section>
    </main>
  </body>
</html>
